<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>江陵鼓角声景图 · 烽火战云</title>
    <!-- Font Awesome 6 (古风图标库) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* 避免拖拽时选中文字，但保留点击功能 */
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0a0502;
            font-family: 'Segoe UI', '华文楷书', 'Microsoft YaHei', '古风体', serif;
            position: relative;
        }

        /* 古地图容器 */
        .map-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* 背景图片：用户可替换同目录图片名 */
            background: url('image39.jpg') no-repeat center center;
            background-size: contain;
            background-color: #1f1a12; /* 边缘填充色，古旧感 */
            cursor: crosshair;
        }

        /* ----- 硝烟粒子画布 (高强度战火硝烟) ----- */
        #smokeCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;  /* 让烟雾不干扰点击 */
            z-index: 10;
            opacity: 0.85;
        }

        /* 古风点位通用样式 (可拖拽、美观) */
        .point {
            position: absolute;
            cursor: grab;
            transition: transform 0.2s ease, filter 0.2s;
            z-index: 30;
            filter: drop-shadow(0 0 5px rgba(0,0,0,0.6));
            pointer-events: auto;
            transform-origin: center;
        }
        .point:active {
            cursor: grabbing;
        }
        .point:hover {
            transform: scale(1.1);
            filter: drop-shadow(0 0 12px rgba(255, 80, 40, 0.8));
            z-index: 40;
        }

        /* 战鼓样式 — 古铜战鼓 */
        .drum-icon {
            width: 56px;
            height: 56px;
            background: radial-gradient(circle at 30% 30%, #b53a1a, #6a1e0a);
            border-radius: 50%;
            box-shadow: 0 0 0 3px #e0ac69, 0 0 0 6px #4a2512, 0 0 20px #ff4d00;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #ffd48a;
            text-shadow: 2px 2px 0 #5a1e00;
            transition: all 0.2s;
            animation: drum-glow 1.2s infinite alternate;
            backdrop-filter: blur(1px);
        }
        @keyframes drum-glow {
            0% { box-shadow: 0 0 0 3px #e0ac69, 0 0 0 6px #4a2512, 0 0 15px #ff4d00; }
            100% { box-shadow: 0 0 0 3px #ffcf8a, 0 0 0 6px #a03410, 0 0 35px #ff7700, 0 0 10px #ff3300; }
        }

        /* 号角样式 — 牛角/号角 */
        .horn-icon {
            width: 52px;
            height: 52px;
            background: radial-gradient(circle at 40% 35%, #dba53f, #8b5a2b);
            border-radius: 40% 60% 50% 50%;
            transform: rotate(15deg);
            box-shadow: 0 0 0 3px #ffcd7e, 0 5px 12px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #fff0b5;
            text-shadow: 1px 1px 0 #7a3e00;
            transition: all 0.2s;
            animation: horn-pulse 1.6s infinite alternate;
        }
        @keyframes horn-pulse {
            0% { box-shadow: 0 0 0 3px #ffcd7e, 0 0 5px #ffaa33; }
            100% { box-shadow: 0 0 0 3px #ffe5a3, 0 0 28px #ffaa33, 0 0 15px #ff7711; }
        }

        /* 浮动标签 (古风卷轴) */
        .point-label {
            position: absolute;
            bottom: -32px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e130cee;
            backdrop-filter: blur(4px);
            color: #ffefc0;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            letter-spacing: 2px;
            border-left: 2px solid #cb7b3c;
            border-right: 2px solid #cb7b3c;
            font-family: 'Segoe UI', '华文楷书', monospace;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            box-shadow: 0 2px 8px black;
        }
        .point:hover .point-label {
            opacity: 1;
            bottom: -38px;
        }

        /* 唯一主控按钮 — 战场号令 */
        .war-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            background: radial-gradient(ellipse at 30% 20%, #b5451c, #551a08);
            border: none;
            border-radius: 60px;
            padding: 14px 28px;
            color: #fff3cf;
            font-size: 22px;
            font-weight: bold;
            font-family: '华文楷书', 'Segoe UI', serif;
            letter-spacing: 4px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6), 0 0 12px #ff8c42;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(2px);
            border-bottom: 3px solid #ffb669;
        }
        .war-button i {
            font-size: 28px;
            filter: drop-shadow(0 0 4px gold);
        }
        .war-button:hover {
            transform: scale(1.05);
            background: radial-gradient(ellipse at 30% 20%, #d55a2a, #742008);
            box-shadow: 0 0 20px #ff884d;
            letter-spacing: 6px;
        }
        .war-button.playing {
            box-shadow: 0 0 20px #ff3300, 0 0 35px #ff884d;
            background: radial-gradient(ellipse at 30% 20%, #c24318, #3f1204);
        }

        /* 拖拽提示符（小提示） */
        .drag-hint {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.5);
            color: #ddbb88;
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 20px;
            z-index: 1000;
            font-family: monospace;
            backdrop-filter: blur(4px);
            pointer-events: none;
        }

        /* 响应式微调 */
        @media (max-width: 700px) {
            .drum-icon, .horn-icon { width: 44px; height: 44px; font-size: 26px; }
            .war-button { padding: 8px 18px; font-size: 18px; bottom: 20px; right: 20px; }
            .point-label { font-size: 10px; bottom: -28px; }
        }
    </style>
</head>
<body>
<div class="map-container" id="mapContainer">
    <!-- 硝烟专用canvas -->
    <canvas id="smokeCanvas"></canvas>

    <!-- 战鼓点位 (古风拖拽样式, 可自由对齐背景图标) -->
    <div class="point drum-point" data-type="drum" style="top: 38%; left: 18%;">
        <div class="drum-icon"><i class="fas fa-drum"></i></div>
        <div class="point-label">⚡ 战鼓 · 天威 ⚡</div>
    </div>
    <div class="point drum-point" data-type="drum" style="top: 22%; left: 33%;">
        <div class="drum-icon"><i class="fas fa-drumstick-bite"></i></div>
        <div class="point-label">⚡ 鼙鼓 · 雷动 ⚡</div>
    </div>
    <div class="point drum-point" data-type="drum" style="top: 28%; left: 63%;">
        <div class="drum-icon"><i class="fas fa-drum"></i></div>
        <div class="point-label">⚡ 战鼓 · 裂石 ⚡</div>
    </div>

    <!-- 号角点位 -->
    <div class="point horn-point" data-type="horn" style="top: 27%; left: 21%;">
        <div class="horn-icon"><i class="fas fa-bullhorn"></i></div>
        <div class="point-label">📯 号角 · 冲阵 📯</div>
    </div>
    <div class="point horn-point" data-type="horn" style="top: 25%; left: 45%;">
        <div class="horn-icon"><i class="fas fa-flag-checkered"></i></div>
        <div class="point-label">📯 胡角 · 霜风 📯</div>
    </div>
    <div class="point horn-point" data-type="horn" style="top: 37%; left: 71%;">
        <div class="horn-icon"><i class="fas fa-fan"></i></div>
        <div class="point-label">📯 画角 · 连营 📯</div>
    </div>
</div>

<!-- 唯一控制按钮: 战场声景开关 -->
<button id="battleToggleBtn" class="war-button">
    <i class="fas fa-drumstick-bite"></i> 擂鼓鸣角 · 启烽烟 <i class="fas fa-bullhorn"></i>
</button>
<div class="drag-hint">
    <i class="fas fa-arrows-alt"></i> 拖拽图标 对齐地图古器
</div>

<!-- 音频元素：战鼓(循环) + 号角(用于定时触发) + 额外配声(新战场肃杀声) -->
<audio id="drumLoop" preload="auto" loop></audio>
<audio id="hornEffect" preload="auto"></audio>
<audio id="extraWarCry" preload="auto"></audio>

<script>
    (function(){
        // --------------------------------------------------------------
        // 稳定音效源配置 (均为可用在线资源)
        //    战鼓循环: 雄浑战鼓节奏
        const DRUM_SRC = "testvideo.m4a";
        //    号角单次: 激昂号角声
        const HORN_SRC = "https://cdn.pixabay.com/download/audio/2021/12/12/audio_ba6a08e6c4.mp3?filename=battle-horn-103387.mp3";
        //    额外配置声音: 战场杀气 + 嘶吼 + 金戈铁马
        const EXTRA_SRC = "https://cdn.pixabay.com/download/audio/2022/04/01/audio_6aa932aacc.mp3?filename=battle-ambience-8027.mp3";
        
        // DOM 元素
        const drumAudio = document.getElementById('drumLoop');
        const hornAudio = document.getElementById('hornEffect');
        const extraAudio = document.getElementById('extraWarCry');
        const toggleBtn = document.getElementById('battleToggleBtn');
        
        // ========== 修复声音重叠 & 全局暂停的关键 ==========
        // 1. 维护全局临时音频实例 (用于点位点击，避免创建无数个Audio对象导致重叠)
        //    - 每次点击只使用同一个实例，且重新播放会覆盖先前未播完的，杜绝叠加
        const tempDrumAudio = new Audio(DRUM_SRC);
        const tempHornAudio = new Audio(HORN_SRC);
        // 设置音量和预加载
        tempDrumAudio.volume = 0.62;
        tempHornAudio.volume = 0.68;
        tempDrumAudio.preload = "auto";
        tempHornAudio.preload = "auto";
        
        // 状态变量
        let isPlaying = false;        // 声景总开关 (全局控制，包括背景循环和点位音效)
        let hornInterval = null;      // 号角循环定时器
        
        // 背景音频初始配置
        drumAudio.src = DRUM_SRC;
        drumAudio.loop = true;
        drumAudio.volume = 0.65;
        
        hornAudio.src = HORN_SRC;
        hornAudio.loop = false;
        hornAudio.volume = 0.7;
        
        extraAudio.src = EXTRA_SRC;
        extraAudio.loop = false;
        extraAudio.volume = 0.55;
        
        // 辅助函数: 播放额外配声 (战场杀伐底鸣)
        function playExtraOnce() {
            if (!isPlaying) return;
            if (extraAudio) {
                extraAudio.currentTime = 0;
                extraAudio.play().catch(e => console.log("额外音效播放受限", e));
            }
        }
        
        // 播放号角 (单次，背景间隔用)
        function playHornOnce() {
            if (!isPlaying) return;
            if (hornAudio) {
                hornAudio.currentTime = 0;
                hornAudio.play().catch(e => console.log("号角播放受限", e));
            }
        }
        
        // ========== 全局停止所有声音(包括背景循环 + 临时点位音频) ==========
        function stopAllSounds() {
            // 停止背景战鼓循环
            drumAudio.pause();
            drumAudio.currentTime = 0;
            // 停止背景号角即时播放
            hornAudio.pause();
            hornAudio.currentTime = 0;
            // 停止额外配声
            extraAudio.pause();
            extraAudio.currentTime = 0;
            
            // 【关键修复】停止所有临时点位音频 (避免关闭全局后仍然发声)
            tempDrumAudio.pause();
            tempDrumAudio.currentTime = 0;
            tempHornAudio.pause();
            tempHornAudio.currentTime = 0;
            
            // 清除定时器 (号角间隔和额外配声间隔)
            if (hornInterval) {
                clearInterval(hornInterval);
                hornInterval = null;
            }
            if (window.extraInterval) {
                clearInterval(window.extraInterval);
                window.extraInterval = null;
            }
        }
        
        // 开始所有声音 (战鼓循环 + 号角间隔 + 额外战吼配声)
        function startAllSounds() {
            if (!isPlaying) return;
            // 播放战鼓循环
            drumAudio.play().catch(e => console.warn("自动播放策略需交互, 已通过按钮手势触发", e));
            // 立即响一号角振奋士气
            playHornOnce();
            // 同时额外配声 (战场杀气)
            playExtraOnce();
            // 设置号角间隔: 每3.8秒一声号角，模拟战场号令
            if (hornInterval) clearInterval(hornInterval);
            hornInterval = setInterval(() => {
                if (isPlaying) {
                    playHornOnce();
                }
            }, 3800);
            // 附加额外配声每隔12秒再重现一次战场压迫感
            if (window.extraInterval) clearInterval(window.extraInterval);
            window.extraInterval = setInterval(() => {
                if (isPlaying) {
                    playExtraOnce();
                }
            }, 12500);
        }
        
        // 切换总声景 (右下角主控)
        function toggleBattleSoundscape() {
            if (isPlaying) {
                // 关闭所有声音 (包括背景和临时音效)
                stopAllSounds();
                isPlaying = false;
                toggleBtn.innerHTML = '<i class="fas fa-drumstick-bite"></i> 擂鼓鸣角 · 启烽烟 <i class="fas fa-bullhorn"></i>';
                toggleBtn.classList.remove('playing');
            } else {
                // 开启声景 (通过用户手势)
                isPlaying = true;
                toggleBtn.innerHTML = '<i class="fas fa-skull-crossbones"></i> 鼓角震天 · 止戈息 <i class="fas fa-dragon"></i>';
                toggleBtn.classList.add('playing');
                // 调用开始序列 (必须由用户点击触发，浏览器允许)
                startAllSounds();
            }
        }
        
        // 绑定唯一按钮事件
        toggleBtn.addEventListener('click', toggleBattleSoundscape);
        
        // ========== 修正点位点击音效: 使用单一实例 + 受全局开关控制 ==========
        // 播放单次战鼓或号角 (不再新建Audio，避免重叠，且受isPlaying限制)
        function playSingleSound(type) {
            // 【核心修复】只有全局声景开启时，点击点位才播放音效，实现真正的全局暂停/播放
            if (!isPlaying) return;
            
            let targetAudio = null;
            if (type === 'drum') {
                targetAudio = tempDrumAudio;
            } else if (type === 'horn') {
                targetAudio = tempHornAudio;
            }
            if (targetAudio) {
                // 停止当前正在播放的实例，重置时间从头播放，避免多个声音同时叠加
                targetAudio.pause();
                targetAudio.currentTime = 0;
                targetAudio.play().catch(e => console.log("临时音效播放受限", e));
            }
            // 增加震感特效 (瞬移高亮)
            const btnFlash = document.createElement('div');
            btnFlash.style.position = 'fixed';
            btnFlash.style.top = '0'; btnFlash.style.left = '0';
            btnFlash.style.width = '100%'; btnFlash.style.height = '100%';
            btnFlash.style.backgroundColor = 'rgba(255,80,0,0.12)';
            btnFlash.style.pointerEvents = 'none';
            btnFlash.style.zIndex = '9999';
            btnFlash.style.transition = '0.2s';
            document.body.appendChild(btnFlash);
            setTimeout(()=> btnFlash.remove(), 150);
        }
        
        // 给所有战鼓点绑定点击事件 (使用修复后的playSingleSound)
        document.querySelectorAll('.drum-point').forEach(point => {
            point.addEventListener('click', (e) => {
                e.stopPropagation();
                playSingleSound('drum');
            });
        });
        document.querySelectorAll('.horn-point').forEach(point => {
            point.addEventListener('click', (e) => {
                e.stopPropagation();
                playSingleSound('horn');
            });
        });
        
        // ------------------- 拖拽点位精确对齐古画图标 (保留原汁原味拖拽体验) -------------------
        const points = document.querySelectorAll('.point');
        let dragTarget = null;
        let startX, startY, startLeft, startTop;
        
        function onMouseMove(e) {
            if (!dragTarget) return;
            e.preventDefault();
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            let newLeft = startLeft + dx;
            let newTop = startTop + dy;
            const parentRect = dragTarget.parentElement.getBoundingClientRect();
            newLeft = Math.min(Math.max(newLeft, -5), parentRect.width - dragTarget.offsetWidth + 5);
            newTop = Math.min(Math.max(newTop, -5), parentRect.height - dragTarget.offsetHeight + 5);
            dragTarget.style.left = newLeft + 'px';
            dragTarget.style.top = newTop + 'px';
        }
        
        function onMouseUp(e) {
            if (dragTarget) {
                dragTarget.style.cursor = 'grab';
                dragTarget = null;
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
            }
        }
        
        points.forEach(point => {
            point.addEventListener('mousedown', (e) => {
                e.stopPropagation();
                if (e.button !== 0) return;
                dragTarget = point;
                let currentLeft = point.style.left;
                let currentTop = point.style.top;
                if (currentLeft.includes('%')) {
                    const parentW = point.parentElement.clientWidth;
                    const percent = parseFloat(currentLeft) / 100;
                    currentLeft = percent * parentW + 'px';
                }
                if (currentTop.includes('%')) {
                    const parentH = point.parentElement.clientHeight;
                    const percent = parseFloat(currentTop) / 100;
                    currentTop = percent * parentH + 'px';
                }
                startLeft = parseFloat(currentLeft);
                startTop = parseFloat(currentTop);
                startX = e.clientX;
                startY = e.clientY;
                point.style.cursor = 'grabbing';
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
                e.preventDefault();
            });
            point.addEventListener('dragstart', (e) => e.preventDefault());
            // 避免拖拽结束时误触发click播放声音 (防拖拽误触)
            let dragOccurred = false;
            point.addEventListener('mousedown', () => { dragOccurred = false; });
            point.addEventListener('mousemove', () => { if (dragTarget === point) dragOccurred = true; });
            point.addEventListener('click', (e) => {
                if (dragOccurred) {
                    e.stopPropagation();
                    dragOccurred = false;
                    return;
                }
                // 正常click逻辑已经在单独的 drum-point / horn-point 监听器中处理，无需额外干预
            });
        });
        
        // 页面resize保留用户拖拽px坐标适应性
        window.addEventListener('resize', () => {
            // 对于百分比转px的处理已完整，resize不对坐标额外干扰
        });
        
        // ------------------- 增强硝烟感：canvas 粒子系统 (烽火狼烟) -------------------
        const canvas = document.getElementById('smokeCanvas');
        let ctx = canvas.getContext('2d');
        let particles = [];
        const PARTICLE_COUNT = 110;
        
        function resizeCanvas() {
            const container = document.getElementById('mapContainer');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        
        class SmokeParticle {
            constructor(x, y, size, speedY, speedX, opacity, color) {
                this.x = x;
                this.y = y;
                this.size = size;
                this.speedY = speedY;
                this.speedX = speedX;
                this.opacity = opacity;
                this.color = color;
                this.life = 1;
                this.decay = 0.003 + Math.random() * 0.006;
            }
            update() {
                this.x += this.speedX;
                this.y -= this.speedY;
                this.life -= this.decay;
                this.opacity = this.opacity * 0.98;
                if (this.life <= 0.05 || this.y < -100 || this.x > canvas.width + 200 || this.x < -200) {
                    this.reset();
                }
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 80;
                this.size = 30 + Math.random() * 90;
                this.speedY = 0.5 + Math.random() * 1.8;
                this.speedX = (Math.random() - 0.5) * 0.6;
                this.life = 0.9 + Math.random() * 0.3;
                this.opacity = 0.2 + Math.random() * 0.45;
                let grayVal = 60 + Math.random() * 70;
                this.color = `rgba(${grayVal}, ${grayVal-20}, ${grayVal-40}, `;
            }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.opacity * this.life;
                ctx.beginPath();
                ctx.ellipse(this.x, this.y, this.size * 0.7, this.size * 0.5, 0, 0, Math.PI * 2);
                ctx.fillStyle = this.color + (this.opacity * this.life) + ")";
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(this.x - this.size*0.2, this.y - this.size*0.1, this.size*0.4, this.size*0.3, 0, 0, Math.PI*2);
                ctx.fillStyle = `rgba(40, 20, 5, ${0.3 * this.life})`;
                ctx.fill();
                ctx.restore();
            }
        }
        
        function initSmoke() {
            resizeCanvas();
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                let baseGray = 40 + Math.random() * 70;
                let col = `rgba(${baseGray}, ${baseGray-25}, ${baseGray-40}, `;
                particles.push(new SmokeParticle(
                    Math.random() * canvas.width,
                    Math.random() * canvas.height,
                    35 + Math.random() * 100,
                    0.4 + Math.random() * 1.5,
                    (Math.random() - 0.5) * 0.5,
                    0.25 + Math.random() * 0.4,
                    col
                ));
            }
        }
        
        function animateSmoke() {
            if (!ctx) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let p of particles) {
                p.update();
                p.draw(ctx);
            }
            ctx.globalCompositeOperation = 'lighter';
            for(let i=0;i<20;i++){
                let w = canvas.width;
                let h = canvas.height;
                ctx.beginPath();
                ctx.rect(0,0,w,h);
                ctx.fillStyle = `rgba(20, 12, 5, 0.03)`;
                ctx.fill();
            }
            ctx.globalCompositeOperation = 'source-over';
            requestAnimationFrame(animateSmoke);
        }
        
        window.addEventListener('resize', () => {
            resizeCanvas();
            for(let p of particles) {
                if(p.x > canvas.width) p.x = canvas.width - 50;
                if(p.x < 0) p.x = 50;
                if(p.y > canvas.height) p.y = canvas.height - 20;
            }
        });
        
        initSmoke();
        animateSmoke();
        
        // 动态背景火焰灼烧感 (周期性微红晕)
        setInterval(() => {
            if(!document.getElementById('mapContainer')) return;
            const overlay = document.createElement('div');
            overlay.style.position = 'fixed';
            overlay.style.bottom = '0';
            overlay.style.left = '0';
            overlay.style.width = '100%';
            overlay.style.height = '100%';
            overlay.style.background = 'radial-gradient(circle at 30% 70%, rgba(80,20,0,0.08), transparent 70%)';
            overlay.style.pointerEvents = 'none';
            overlay.style.zIndex = '15';
            document.body.appendChild(overlay);
            setTimeout(()=> overlay.remove(), 800);
        }, 4200);
        
        // 页面关闭前清理所有声音和定时器，防止后台播放
        window.addEventListener('beforeunload', () => {
            if (hornInterval) clearInterval(hornInterval);
            if (window.extraInterval) clearInterval(window.extraInterval);
            drumAudio.pause();
            hornAudio.pause();
            extraAudio.pause();
            tempDrumAudio.pause();
            tempHornAudio.pause();
        });
        
        // 预加载临时音频，但不自动播放 (提升响应)
        tempDrumAudio.load();
        tempHornAudio.load();
        
        // 优雅提示
        console.log("江陵鼓角声景已载 — 全局开关控制所有声音，点击点位亦受控，且不再重叠");
    })();
</script>
</body>
