<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>江陵鼓角声景图 · 剑拔弩张 · 烽火战云</title>
    <!-- Font Awesome 6 (古风图标库) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* 避免拖拽时选中文字，保留点击功能 */
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0a0502;
            font-family: 'Segoe UI', '华文楷书', 'Microsoft YaHei', '古风体', serif;
            position: relative;
        }

        /* 古地图容器 —— 增加亮度提亮 & 剑拔弩张氛围滤镜 */
        .map-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('image39.jpg') no-repeat center center;
            background-size: contain;
            background-color: #2a1f12;  /* 提亮底色，减少昏暗感 */
            cursor: crosshair;
            background-attachment: fixed;
            will-change: background-image;
            transition: filter 0.3s;
        }
        
        /* 亮度/对比度增强 —— 让硝烟画面不再过暗，同时增加战场的压迫感 */
        .map-container.bright-battle {
            filter: brightness(1.12) contrast(1.08) saturate(1.05);
        }
        
        /* 额外动态火光叠加层 (持续提升亮区) */
        .dynamic-fire-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 8;
            background: radial-gradient(circle at 30% 40%, rgba(210, 70, 20, 0.08), rgba(0,0,0,0) 70%);
            mix-blend-mode: overlay;
            animation: firePulse 3s infinite alternate;
        }
        
        @keyframes firePulse {
            0% { opacity: 0.3; background: radial-gradient(circle at 30% 40%, rgba(230, 100, 30, 0.1), transparent 70%);}
            100% { opacity: 0.7; background: radial-gradient(circle at 60% 50%, rgba(255, 120, 40, 0.25), transparent 75%);}
        }

        /* 硝烟粒子画布 */
        #smokeCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            opacity: 0.9;
        }

        /* 古风点位通用样式 (拖拽/固定闪烁共用) */
        .point {
            position: absolute;
            cursor: grab;
            transition: transform 0.2s ease, filter 0.2s;
            z-index: 30;
            filter: drop-shadow(0 0 5px rgba(0,0,0,0.6));
            pointer-events: auto;
            transform-origin: center;
        }
        .point:active {
            cursor: grabbing;
        }
        /* 未固定时 hover 效果 */
        .point:not(.fixed-point):hover {
            transform: scale(1.1);
            filter: drop-shadow(0 0 12px rgba(255, 80, 40, 0.8));
            z-index: 40;
        }
        
        /* 固定之后的闪烁特效 (剑拔弩张) */
        .point.fixed-point {
            cursor: pointer;
            animation: warDriftGlow 0.6s infinite alternate ease-in-out;
        }
        
        @keyframes warDriftGlow {
            0% {
                filter: drop-shadow(0 0 3px #ffaa33) drop-shadow(0 0 5px #ff5500);
                transform: scale(1);
            }
            100% {
                filter: drop-shadow(0 0 18px #ff3300) drop-shadow(0 0 25px #ffaa00);
                transform: scale(1.05);
            }
        }
        
        /* 鼓/号角内部元素单独闪烁加强 */
        .point.fixed-point .drum-icon,
        .point.fixed-point .horn-icon {
            animation: iconPulseBlood 0.55s infinite alternate;
        }
        
        @keyframes iconPulseBlood {
            0% {
                box-shadow: 0 0 0 2px #e0ac69, 0 0 0 5px #4a2512, 0 0 12px #ff6600;
                text-shadow: 0 0 2px gold;
            }
            100% {
                box-shadow: 0 0 0 4px #ffd966, 0 0 0 8px #9b3a1a, 0 0 32px #ff2200, 0 0 18px #ff8800;
                text-shadow: 0 0 8px rgb(255, 60, 0);
            }
        }

        /* 战鼓样式 — 古铜战鼓 */
        .drum-icon {
            width: 56px;
            height: 56px;
            background: radial-gradient(circle at 30% 30%, #b53a1a, #6a1e0a);
            border-radius: 50%;
            box-shadow: 0 0 0 3px #e0ac69, 0 0 0 6px #4a2512, 0 0 20px #ff4d00;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #ffd48a;
            text-shadow: 2px 2px 0 #5a1e00;
            transition: all 0.2s;
            animation: drum-glow 1.2s infinite alternate;
            backdrop-filter: blur(1px);
        }
        @keyframes drum-glow {
            0% { box-shadow: 0 0 0 3px #e0ac69, 0 0 0 6px #4a2512, 0 0 15px #ff4d00; }
            100% { box-shadow: 0 0 0 3px #ffcf8a, 0 0 0 6px #a03410, 0 0 35px #ff7700, 0 0 10px #ff3300; }
        }

        /* 号角样式 */
        .horn-icon {
            width: 52px;
            height: 52px;
            background: radial-gradient(circle at 40% 35%, #dba53f, #8b5a2b);
            border-radius: 40% 60% 50% 50%;
            transform: rotate(15deg);
            box-shadow: 0 0 0 3px #ffcd7e, 0 5px 12px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #fff0b5;
            text-shadow: 1px 1px 0 #7a3e00;
            transition: all 0.2s;
            animation: horn-pulse 1.6s infinite alternate;
        }
        @keyframes horn-pulse {
            0% { box-shadow: 0 0 0 3px #ffcd7e, 0 0 5px #ffaa33; }
            100% { box-shadow: 0 0 0 3px #ffe5a3, 0 0 28px #ffaa33, 0 0 15px #ff7711; }
        }

        /* 浮动标签 */
        .point-label {
            position: absolute;
            bottom: -32px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e130cee;
            backdrop-filter: blur(4px);
            color: #ffefc0;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            letter-spacing: 2px;
            border-left: 2px solid #cb7b3c;
            border-right: 2px solid #cb7b3c;
            font-family: 'Segoe UI', '华文楷书', monospace;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            box-shadow: 0 2px 8px black;
        }
        .point:hover .point-label {
            opacity: 1;
            bottom: -38px;
        }

        /* 双按钮容器 */
        .buttons-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: flex-end;
        }
        
        /* 战场号令主按钮 */
        .war-button {
            background: radial-gradient(ellipse at 30% 20%, #b5451c, #551a08);
            border: none;
            border-radius: 60px;
            padding: 12px 26px;
            color: #fff3cf;
            font-size: 20px;
            font-weight: bold;
            font-family: '华文楷书', 'Segoe UI', serif;
            letter-spacing: 3px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6), 0 0 12px #ff8c42;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(2px);
            border-bottom: 3px solid #ffb669;
        }
        .war-button i {
            font-size: 26px;
            filter: drop-shadow(0 0 4px gold);
        }
        .war-button:hover {
            transform: scale(1.02);
            background: radial-gradient(ellipse at 30% 20%, #d55a2a, #742008);
            letter-spacing: 4px;
        }
        .war-button.playing {
            box-shadow: 0 0 20px #ff3300, 0 0 35px #ff884d;
            background: radial-gradient(ellipse at 30% 20%, #c24318, #3f1204);
        }
        
        /* 剑拔弩张·固定按钮 */
        .fix-btn {
            background: radial-gradient(ellipse at 30% 20%, #a1351a, #3e1a0c);
            border: none;
            border-radius: 60px;
            padding: 10px 24px;
            color: #fff0cf;
            font-size: 18px;
            font-family: '华文楷书', 'Segoe UI', serif;
            letter-spacing: 3px;
            cursor: pointer;
            box-shadow: 0 6px 16px black;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(2px);
            transition: 0.2s;
            border-left: 2px solid #e0a15c;
            border-right: 2px solid #e0a15c;
        }
        .fix-btn i {
            font-size: 22px;
            color: #ffbb77;
        }
        .fix-btn:hover {
            background: radial-gradient(ellipse at 30% 20%, #bd4824, #631e0a);
            transform: scale(1.02);
            letter-spacing: 4px;
            box-shadow: 0 0 15px #ff7733;
        }
        .fix-btn.disabled {
            opacity: 0.7;
            cursor: default;
            filter: grayscale(0.1);
        }
        
        .drag-hint {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.6);
            color: #eebb77;
            font-size: 12px;
            padding: 5px 14px;
            border-radius: 20px;
            z-index: 1000;
            font-family: monospace;
            backdrop-filter: blur(4px);
            pointer-events: none;
        }

        @media (max-width: 700px) {
            .drum-icon, .horn-icon { width: 44px; height: 44px; font-size: 26px; }
            .war-button, .fix-btn { padding: 7px 16px; font-size: 14px; }
            .point-label { font-size: 10px; }
        }
    </style>
</head>
<body>
<div class="map-container" id="mapContainer">
    <!-- 动态火光提亮层 -->
    <div class="dynamic-fire-overlay"></div>
    <!-- 硝烟画布 -->
    <canvas id="smokeCanvas"></canvas>
    <!-- 剑拔弩张特效canvas (刀光剑影) -->
    <canvas id="swordAuraCanvas" style="position: absolute; top:0; left:0; width:100%; height:100%; pointer-events: none; z-index: 20;"></canvas>

    <!-- 战鼓点位 (初始可拖拽) -->
    <div class="point drum-point" data-type="drum" style="top: 38%; left: 18%;">
        <div class="drum-icon"><i class="fas fa-drum"></i></div>
        <div class="point-label">⚡ 战鼓 · 天威 ⚡</div>
    </div>
    <div class="point drum-point" data-type="drum" style="top: 22%; left: 33%;">
        <div class="drum-icon"><i class="fas fa-drumstick-bite"></i></div>
        <div class="point-label">⚡ 鼙鼓 · 雷动 ⚡</div>
    </div>
    <div class="point drum-point" data-type="drum" style="top: 28%; left: 63%;">
        <div class="drum-icon"><i class="fas fa-drum"></i></div>
        <div class="point-label">⚡ 战鼓 · 裂石 ⚡</div>
    </div>

    <!-- 号角点位 -->
    <div class="point horn-point" data-type="horn" style="top: 27%; left: 21%;">
        <div class="horn-icon"><i class="fas fa-bullhorn"></i></div>
        <div class="point-label">📯 号角 · 冲阵 📯</div>
    </div>
    <div class="point horn-point" data-type="horn" style="top: 25%; left: 45%;">
        <div class="horn-icon"><i class="fas fa-flag-checkered"></i></div>
        <div class="point-label">📯 胡角 · 霜风 📯</div>
    </div>
    <div class="point horn-point" data-type="horn" style="top: 37%; left: 71%;">
        <div class="horn-icon"><i class="fas fa-fan"></i></div>
        <div class="point-label">📯 画角 · 连营 📯</div>
    </div>
</div>

<div class="buttons-container">
    <button id="battleToggleBtn" class="war-button">
        <i class="fas fa-drumstick-bite"></i> 擂鼓鸣角 · 启烽烟 <i class="fas fa-bullhorn"></i>
    </button>
    <button id="fixPointsBtn" class="fix-btn">
        <i class="fas fa-fist-raised"></i> 剑拔弩张 · 镇山河 <i class="fas fa-dragon"></i>
    </button>
</div>
<div class="drag-hint">
    <i class="fas fa-arrows-alt"></i> 拖拽鼓角，对齐古画烽燧 → 点击「剑拔弩张」锁定并激发万剑光影！
</div>

<!-- 音频元素 -->
<audio id="drumLoop" preload="auto" loop></audio>
<audio id="hornEffect" preload="auto"></audio>
<audio id="extraWarCry" preload="auto"></audio>

<script>
    (function(){
        // ------------------- 音效配置 --------------------
        const DRUM_SRC = "video.m4a";
        const HORN_SRC = "https://cdn.pixabay.com/download/audio/2021/12/12/audio_ba6a08e6c4.mp3?filename=battle-horn-103387.mp3";
        const EXTRA_SRC = "https://cdn.pixabay.com/download/audio/2022/04/01/audio_6aa932aacc.mp3?filename=battle-ambience-8027.mp3";
        
        const drumAudio = document.getElementById('drumLoop');
        const hornAudio = document.getElementById('hornEffect');
        const extraAudio = document.getElementById('extraWarCry');
        const toggleBtn = document.getElementById('battleToggleBtn');
        const fixBtn = document.getElementById('fixPointsBtn');
        
        // 全局播放状态 & 拖拽锁
        let isPlaying = false;
        let hornInterval = null;
        let dragEnabled = true;     // 默认可拖拽，固定后变为false
        
        // 临时音效单例
        const tempDrumAudio = new Audio(DRUM_SRC);
        const tempHornAudio = new Audio(HORN_SRC);
        tempDrumAudio.volume = 0.62;
        tempHornAudio.volume = 0.68;
        tempDrumAudio.preload = "auto";
        tempHornAudio.preload = "auto";
        
        // 背景音频初始化
        drumAudio.src = DRUM_SRC;
        drumAudio.loop = true;
        drumAudio.volume = 0.65;
        hornAudio.src = HORN_SRC;
        hornAudio.volume = 0.7;
        extraAudio.src = EXTRA_SRC;
        extraAudio.volume = 0.55;
        
        function playExtraOnce() {
            if (!isPlaying) return;
            if (extraAudio) {
                extraAudio.currentTime = 0;
                extraAudio.play().catch(e => console.log("额外音效受限"));
            }
        }
        
        function playHornOnce() {
            if (!isPlaying) return;
            if (hornAudio) {
                hornAudio.currentTime = 0;
                hornAudio.play().catch(e => console.log("号角受限"));
            }
        }
        
        function stopAllSounds() {
            drumAudio.pause();
            drumAudio.currentTime = 0;
            hornAudio.pause();
            hornAudio.currentTime = 0;
            extraAudio.pause();
            extraAudio.currentTime = 0;
            tempDrumAudio.pause();
            tempDrumAudio.currentTime = 0;
            tempHornAudio.pause();
            tempHornAudio.currentTime = 0;
            if (hornInterval) { clearInterval(hornInterval); hornInterval = null; }
            if (window.extraInterval) { clearInterval(window.extraInterval); window.extraInterval = null; }
        }
        
        function startAllSounds() {
            if (!isPlaying) return;
            drumAudio.play().catch(e=>console.warn("需用户交互"));
            playHornOnce();
            playExtraOnce();
            if (hornInterval) clearInterval(hornInterval);
            hornInterval = setInterval(() => { if(isPlaying) playHornOnce(); }, 3800);
            if (window.extraInterval) clearInterval(window.extraInterval);
            window.extraInterval = setInterval(() => { if(isPlaying) playExtraOnce(); }, 12500);
        }
        
        function toggleBattleSoundscape() {
            if (isPlaying) {
                stopAllSounds();
                isPlaying = false;
                toggleBtn.innerHTML = '<i class="fas fa-drumstick-bite"></i> 擂鼓鸣角 · 启烽烟 <i class="fas fa-bullhorn"></i>';
                toggleBtn.classList.remove('playing');
            } else {
                isPlaying = true;
                toggleBtn.innerHTML = '<i class="fas fa-skull-crossbones"></i> 鼓角震天 · 止戈息 <i class="fas fa-dragon"></i>';
                toggleBtn.classList.add('playing');
                startAllSounds();
            }
        }
        toggleBtn.addEventListener('click', toggleBattleSoundscape);
        
        // 点位音效 (受全局开关控制)
        function playSingleSound(type) {
            if (!isPlaying) return;
            let targetAudio = null;
            if (type === 'drum') targetAudio = tempDrumAudio;
            else if (type === 'horn') targetAudio = tempHornAudio;
            if (targetAudio) {
                targetAudio.pause();
                targetAudio.currentTime = 0;
                targetAudio.play().catch(e=>console.log("临时音效受限"));
            }
            // 视觉震闪
            const flash = document.createElement('div');
            flash.style.position = 'fixed';
            flash.style.top = '0'; flash.style.left = '0';
            flash.style.width = '100%'; flash.style.height = '100%';
            flash.style.backgroundColor = 'rgba(255,80,0,0.15)';
            flash.style.pointerEvents = 'none';
            flash.style.zIndex = '9999';
            flash.style.transition = '0.15s';
            document.body.appendChild(flash);
            setTimeout(()=> flash.remove(), 100);
        }
        
        // ---------------- 拖拽逻辑 (受dragEnabled控制) -----------------
        const points = document.querySelectorAll('.point');
        let dragTarget = null;
        let startX, startY, startLeft, startTop;
        
        function onMouseMove(e) {
            if (!dragTarget || !dragEnabled) return;
            e.preventDefault();
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            let newLeft = startLeft + dx;
            let newTop = startTop + dy;
            const parentRect = dragTarget.parentElement.getBoundingClientRect();
            newLeft = Math.min(Math.max(newLeft, -5), parentRect.width - dragTarget.offsetWidth + 5);
            newTop = Math.min(Math.max(newTop, -5), parentRect.height - dragTarget.offsetHeight + 5);
            dragTarget.style.left = newLeft + 'px';
            dragTarget.style.top = newTop + 'px';
        }
        
        function onMouseUp(e) {
            if (dragTarget) {
                dragTarget.style.cursor = 'grab';
                dragTarget = null;
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
            }
        }
        
        // 重新绑定拖拽事件（统一基于 dragEnabled 标志）
        points.forEach(point => {
            point.addEventListener('mousedown', (e) => {
                if (!dragEnabled) return;   // 固定后禁止拖拽
                e.stopPropagation();
                if (e.button !== 0) return;
                dragTarget = point;
                let currentLeft = point.style.left;
                let currentTop = point.style.top;
                if (currentLeft.includes('%')) {
                    const parentW = point.parentElement.clientWidth;
                    const percent = parseFloat(currentLeft) / 100;
                    currentLeft = percent * parentW + 'px';
                }
                if (currentTop.includes('%')) {
                    const parentH = point.parentElement.clientHeight;
                    const percent = parseFloat(currentTop) / 100;
                    currentTop = percent * parentH + 'px';
                }
                startLeft = parseFloat(currentLeft);
                startTop = parseFloat(currentTop);
                startX = e.clientX;
                startY = e.clientY;
                point.style.cursor = 'grabbing';
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
                e.preventDefault();
            });
            point.addEventListener('dragstart', (e) => e.preventDefault());
        });
        
        // 点击播放音效(防拖拽误触)
        let dragOccurredFlag = false;
        points.forEach(point => {
            point.addEventListener('mousedown', () => { dragOccurredFlag = false; });
            point.addEventListener('mousemove', () => { if (dragTarget === point) dragOccurredFlag = true; });
            point.addEventListener('click', (e) => {
                if (dragOccurredFlag) {
                    dragOccurredFlag = false;
                    return;
                }
                // 根据类型播放音效
                const type = point.classList.contains('drum-point') ? 'drum' : (point.classList.contains('horn-point') ? 'horn' : null);
                if (type) playSingleSound(type);
            });
        });
        
        // ================= 剑拔弩张·固定点位 + 闪烁 + 刀光剑影特效 =================
        let swordAuraActive = false;
        let swordAnimFrame = null;
        const swordCanvas = document.getElementById('swordAuraCanvas');
        let swordCtx = swordCanvas.getContext('2d');
        let fixedMode = false;
        
        // 调整画布尺寸
        function resizeSwordCanvas() {
            const container = document.getElementById('mapContainer');
            swordCanvas.width = container.clientWidth;
            swordCanvas.height = container.clientHeight;
        }
        
        // 绘制动态剑光 - 剑拔弩张效果（随机凌厉光刃，交叉横扫）
        let swordLines = [];
        const MAX_SWORDS = 18;
        
        function initSwordAura() {
            if (!swordCtx) return;
            resizeSwordCanvas();
            // 生成刀光数据
            for (let i = 0; i < MAX_SWORDS; i++) {
                swordLines.push({
                    x1: Math.random() * swordCanvas.width,
                    y1: Math.random() * swordCanvas.height,
                    x2: Math.random() * swordCanvas.width,
                    y2: Math.random() * swordCanvas.height,
                    alpha: Math.random() * 0.5 + 0.2,
                    life: Math.random() * 0.8 + 0.3,
                    speedX: (Math.random() - 0.5) * 1.2,
                    speedY: (Math.random() - 0.5) * 1.2,
                    width: 2 + Math.random() * 5
                });
            }
        }
        
        function updateSwordLines() {
            for (let s of swordLines) {
                // 动态移动，好似剑气纵横
                s.x1 += s.speedX;
                s.y1 += s.speedY;
                s.x2 += s.speedX * 0.9;
                s.y2 += s.speedY * 0.8;
                s.life -= 0.003;
                s.alpha = Math.min(0.8, s.life * 1.2);
                // 边界重置，营造源源不断剑气
                if (s.x1 < -200 || s.x1 > swordCanvas.width + 200 || s.y1 < -200 || s.y1 > swordCanvas.height + 200 || s.life <= 0.05) {
                    s.x1 = Math.random() * swordCanvas.width;
                    s.y1 = Math.random() * swordCanvas.height;
                    s.x2 = s.x1 + (Math.random() - 0.5) * 180;
                    s.y2 = s.y1 + (Math.random() - 0.5) * 180;
                    s.life = 0.7 + Math.random() * 0.5;
                    s.alpha = 0.4;
                    s.speedX = (Math.random() - 0.5) * 1.4;
                    s.speedY = (Math.random() - 0.5) * 1.4;
                    s.width = 2 + Math.random() * 6;
                }
                // 约束
                s.x1 = Math.min(Math.max(s.x1, -50), swordCanvas.width + 50);
                s.y1 = Math.min(Math.max(s.y1, -50), swordCanvas.height + 50);
                s.x2 = Math.min(Math.max(s.x2, -50), swordCanvas.width + 50);
                s.y2 = Math.min(Math.max(s.y2, -50), swordCanvas.height + 50);
            }
        }
        
        function drawSwordAura() {
            if (!swordCtx || !swordAuraActive) return;
            swordCtx.clearRect(0, 0, swordCanvas.width, swordCanvas.height);
            // 残影背景增加杀气
            swordCtx.shadowBlur = 0;
            for (let s of swordLines) {
                if (s.life <= 0.02) continue;
                const gradient = swordCtx.createLinearGradient(s.x1, s.y1, s.x2, s.y2);
                gradient.addColorStop(0, `rgba(255, 70, 30, ${s.alpha * 0.9})`);
                gradient.addColorStop(0.6, `rgba(255, 180, 40, ${s.alpha})`);
                gradient.addColorStop(1, `rgba(220, 60, 20, ${s.alpha * 0.7})`);
                swordCtx.beginPath();
                swordCtx.moveTo(s.x1, s.y1);
                swordCtx.lineTo(s.x2, s.y2);
                swordCtx.lineWidth = s.width;
                swordCtx.strokeStyle = gradient;
                swordCtx.shadowColor = '#ff4400';
                swordCtx.shadowBlur = 10;
                swordCtx.stroke();
                // 附加剑光尖端
                swordCtx.beginPath();
                swordCtx.arc(s.x2, s.y2, s.width * 0.8, 0, Math.PI * 2);
                swordCtx.fillStyle = `rgba(255, 100, 20, ${s.alpha * 0.6})`;
                swordCtx.fill();
            }
            swordCtx.shadowBlur = 0;
            // 额外绘制白色凌厉光痕 (剑拔弩张感)
            for (let i=0; i<6; i++) {
                if (Math.random() > 0.97) {
                    swordCtx.beginPath();
                    let randX = Math.random() * swordCanvas.width;
                    let randY = Math.random() * swordCanvas.height;
                    swordCtx.moveTo(randX, randY);
                    swordCtx.lineTo(randX + (Math.random() - 0.5)*150, randY + (Math.random() - 0.5)*150);
                    swordCtx.lineWidth = 1.5;
                    swordCtx.strokeStyle = `rgba(255, 210, 100, 0.7)`;
                    swordCtx.stroke();
                }
            }
        }
        
        function animateSwords() {
            if (!swordAuraActive) return;
            updateSwordLines();
            drawSwordAura();
            swordAnimFrame = requestAnimationFrame(animateSwords);
        }
        
        function startSwordAura() {
            if (swordAuraActive) return;
            swordAuraActive = true;
            resizeSwordCanvas();
            initSwordAura();
            animateSwords();
        }
        
        function stopSwordAura() {
            if (swordAnimFrame) {
                cancelAnimationFrame(swordAnimFrame);
                swordAnimFrame = null;
            }
            swordAuraActive = false;
            if (swordCtx) swordCtx.clearRect(0, 0, swordCanvas.width, swordCanvas.height);
        }
        
        // 固定所有点位并开启剑拔弩张特效 + 闪烁效果
        function fixPointsAndRouseBlades() {
            if (fixedMode) {
                // 如果已经固定，可再次激活强力闪光，但不重复添加class
                // 加强闪烁动画一闪
                document.querySelectorAll('.point').forEach(p => {
                    p.style.animation = 'none';
                    setTimeout(() => { if(p.classList.contains('fixed-point')) p.style.animation = ''; }, 10);
                });
                // 额外产生一次刀光爆发效果
                if (swordAuraActive) {
                    for(let i=0;i<12;i++) {
                        if(swordLines[i]) swordLines[i].life = 0.9;
                    }
                }
                return;
            }
            // 取消拖拽能力
            dragEnabled = false;
            // 添加固定样式，开启闪烁
            points.forEach(point => {
                point.classList.add('fixed-point');
            });
            // 增加战场提亮、增强硝烟对比
            const mapDiv = document.getElementById('mapContainer');
            mapDiv.classList.add('bright-battle');
            // 启用刀光剑影canvas
            startSwordAura();
            fixedMode = true;
            fixBtn.innerHTML = '<i class="fas fa-skull"></i> 杀气凌霄 · 已镇守 <i class="fas fa-sword"></i>';
            fixBtn.style.opacity = '0.9';
            // 同时增强全局动态火焰效果闪烁更为激烈
            const fireOverlay = document.querySelector('.dynamic-fire-overlay');
            if(fireOverlay) fireOverlay.style.animation = 'firePulse 0.8s infinite alternate';
            // 播放一声战场金铁交鸣(音效可选，利用现有extraAudio播放短促效果)
            if (isPlaying) {
                const clashSound = new Audio("https://cdn.pixabay.com/download/audio/2021/08/09/audio_637e7e0ccd.mp3?filename=sword-clash-37838.mp3");
                clashSound.volume = 0.4;
                clashSound.play().catch(e=>console.log);
            } else {
                // 即使没有开启声景也轻度震动视觉模拟剑拔弩张
                const flashBig = document.createElement('div');
                flashBig.style.cssText = 'position:fixed; top:0; left:0; width:100%; height:100%; background:radial-gradient(circle, rgba(255,100,0,0.2), transparent); pointer-events:none; z-index:9998;';
                document.body.appendChild(flashBig);
                setTimeout(()=>flashBig.remove(), 400);
            }
            // 额外增加卷轴提示
            const hintDiv = document.querySelector('.drag-hint');
            if(hintDiv) hintDiv.innerHTML = '<i class="fas fa-skull-crossbones"></i> 剑拔弩张 · 鼓角争鸣！刀光剑影笼罩战场';
        }
        
        fixBtn.addEventListener('click', fixPointsAndRouseBlades);
        
        // 窗口尺寸适配剑光canvas & 硝烟canvas
        window.addEventListener('resize', () => {
            if(swordAuraActive) resizeSwordCanvas();
            if (typeof resizeCanvas === 'function') resizeCanvas();
        });
        
        // ------------------- 硝烟粒子系统 (增强亮色 + 火星) 提亮硝烟 -------------------
        const canvasSmoke = document.getElementById('smokeCanvas');
        let ctxSmoke = canvasSmoke.getContext('2d');
        let particles = [];
        const PARTICLE_COUNT = 130;  // 增加粒子让硝烟更活跃
        
        function resizeCanvas() {
            const container = document.getElementById('mapContainer');
            canvasSmoke.width = container.clientWidth;
            canvasSmoke.height = container.clientHeight;
        }
        
        class SmokeParticle {
            constructor(x, y, size, speedY, speedX, opacity, color) {
                this.x = x; this.y = y; this.size = size; this.speedY = speedY; this.speedX = speedX;
                this.opacity = opacity; this.color = color; this.life = 1; this.decay = 0.003 + Math.random() * 0.007;
                this.redGlow = Math.random() > 0.7;
            }
            update() {
                this.x += this.speedX;
                this.y -= this.speedY;
                this.life -= this.decay;
                this.opacity = this.opacity * 0.99;
                if (this.life <= 0.05 || this.y < -150 || this.x > canvasSmoke.width + 200 || this.x < -200) this.reset();
            }
            reset() {
                this.x = Math.random() * canvasSmoke.width;
                this.y = canvasSmoke.height + Math.random() * 100;
                this.size = 28 + Math.random() * 100;
                this.speedY = 0.6 + Math.random() * 1.9;
                this.speedX = (Math.random() - 0.5) * 0.8;
                this.life = 0.8 + Math.random() * 0.4;
                this.opacity = 0.25 + Math.random() * 0.5;
                let bright = 80 + Math.random() * 70;
                this.color = `rgba(${bright}, ${bright-25}, ${bright-45}, `;
                this.redGlow = Math.random() > 0.75;
            }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.opacity * this.life * (this.redGlow ? 1.1 : 0.9);
                ctx.beginPath();
                ctx.ellipse(this.x, this.y, this.size * 0.7, this.size * 0.5, 0, 0, Math.PI * 2);
                ctx.fillStyle = this.redGlow ? `rgba(180, 70, 20, ${this.opacity * this.life})` : this.color + (this.opacity * this.life) + ")";
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(this.x - this.size*0.2, this.y - this.size*0.1, this.size*0.4, this.size*0.3, 0, 0, Math.PI*2);
                ctx.fillStyle = this.redGlow ? `rgba(230, 80, 30, ${0.4*this.life})` : `rgba(60, 35, 15, ${0.4*this.life})`;
                ctx.fill();
                ctx.restore();
            }
        }
        
        function initSmokeSys() {
            resizeCanvas();
            for (let i=0; i<PARTICLE_COUNT; i++) {
                let brightBase = 55 + Math.random() * 85;
                let col = `rgba(${brightBase}, ${brightBase-25}, ${brightBase-45}, `;
                particles.push(new SmokeParticle(
                    Math.random() * canvasSmoke.width, Math.random() * canvasSmoke.height,
                    30 + Math.random() * 100, 0.5 + Math.random() * 1.6, (Math.random() - 0.5)*0.6,
                    0.3 + Math.random() * 0.45, col
                ));
            }
        }
        
        function animateSmokeSystem() {
            if (!ctxSmoke) return;
            ctxSmoke.clearRect(0, 0, canvasSmoke.width, canvasSmoke.height);
            for (let p of particles) { p.update(); p.draw(ctxSmoke); }
            ctxSmoke.globalCompositeOperation = 'lighter';
            ctxSmoke.fillStyle = 'rgba(45, 28, 15, 0.05)';
            ctxSmoke.fillRect(0,0, canvasSmoke.width, canvasSmoke.height);
            ctxSmoke.globalCompositeOperation = 'source-over';
            requestAnimationFrame(animateSmokeSystem);
        }
        
        window.addEventListener('resize', () => {
            resizeCanvas();
            if (swordAuraActive) resizeSwordCanvas();
        });
        initSmokeSys();
        animateSmokeSystem();
        // 预加载
        tempDrumAudio.load();
        tempHornAudio.load();
        
        // 页面关闭清理特效和定时器
        window.addEventListener('beforeunload', () => {
            if (hornInterval) clearInterval(hornInterval);
            if (window.extraInterval) clearInterval(window.extraInterval);
            stopSwordAura();
        });
        
        console.log("江陵鼓角·剑拔弩张版加载完毕，拖拽对齐后点「剑拔弩张」即可锁定惊世刀光！");
    })();
</script>
</body>
